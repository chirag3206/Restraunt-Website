<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Page</title>
    <link rel="stylesheet" href="inquiry.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <img src="IMAGES/Logo.jpg" alt="A-One Restaurant Logo" class="logo">
        <nav class="nav">
            <a href="Homepage_Chirag.html">Home</a>
            <a href="gallerypage.html">Gallery</a>
            <a href="order.html">Order Online</a>
            <a href="#private-dining">Private Dining/Events</a>
            <a href="Aboutpage.html">About</a>
            <a href="contactus.html" class="contact-btn">Contact Us</a>
        </nav>
    </header>

    <!-- Inquiry Form -->
    <section class="inquiry-form">
        <h1>YOUR CONTACT INFORMATION</h1>
        <form action="#" method="POST">
            <!-- Contact Information -->
            <div class="form-group">
                <label for="first-name">First Name*</label>
                <input type="text" id="first-name" name="first-name" required>
                
                <label for="last-name">Last Name*</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address*</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number*</label>
                <input type="tel" id="phone" name="phone" required>
                
                <label for="alt-phone">Alt. Number</label>
                <input type="tel" id="alt-phone" name="alt-phone">
            </div>

            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company">
            </div>

            <h1>YOUR EVENT DETAILS</h1>

            <!-- Event Details -->
            <div class="form-group">
                <label for="event-type">Nature of Events</label>
                <input type="text" id="event-type" name="event-type" placeholder="e.g., Birthday Party or Business Dinner">
            </div>

            <div class="form-group">
                <label for="event-date-start">Event Date (Start)*</label>
                <input type="date" id="event-date-start" name="event-date-start" required>
                
                <label for="event-date-end">Event Date (End)*</label>
                <input type="date" id="event-date-end" name="event-date-end" required>
            </div>

            <div class="form-group">
                <label for="start-time">Start Time*</label>
                <input type="time" id="start-time" name="start-time" required>
                
                <label for="end-time">End Time*</label>
                <input type="time" id="end-time" name="end-time" required>
            </div>

            <div class="form-group">
                <label for="people">Number of People*</label>
                <input type="number" id="people" name="people" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Enter your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">SUBMIT</button>
        </form>
    </section>
</body>
</html>
