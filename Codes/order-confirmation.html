<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | A-One Restaurant</title>
    <link rel="stylesheet" href="confirmation.css">
</head>
<body>
    <div class="confirmation-container">
        <h1>Thank You for Your Order!</h1>
        <p class="thank-you-note">We appreciate your choice to dine with A-One Restaurant. Your order is being prepared with care, and we hope you have an enjoyable meal!</p>
        
        <div class="order-summary">
            <p>Your order number is: <span id="order-number"></span></p>
            <p>Order placed at: <span id="order-time"></span></p>
            <p id="table-number-info" style="display: none;">Table Number: <span id="table-number"></span></p>
            <p id="pickup-time-info" style="display: none;">Pickup Time: <span id="pickup-time"></span></p>
        </div>
    </div>
    <script src="confirmation.js"></script>
</body>
</html>
