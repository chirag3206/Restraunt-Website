// Handle the login form submission
function handleLogin(event) {
    event.preventDefault(); // Prevent default form submission

    const form = event.target; // Get the form element
    const email = form.email.value.trim(); // Get the email value
    const password = form.password.value.trim(); // Get the password value

    // Validate email and password inputs
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        alert("Please enter a valid email address.");
        return;
    }
    if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
    }

    // Make a POST request to the backend to log in the user
    fetch('http://localhost:5000/api/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email, password }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            alert('Login successful!');
            window.location.href = 'homeafterlogin.html'; // Redirect to home page after successful login
        } else {
            alert(data.error || 'An error occurred');
        }
    })
    .catch(err => {
        alert('Server error: ' + err);
    });
}


</script>
