// Handle the sign-up form submission
function handleSignUp(event) {
    event.preventDefault(); // Prevent default form submission

    const form = event.target; // Get the form element
    const name = form.name.value.trim(); // Get the name value
    const mobile = form.mobile.value.trim(); // Get the mobile number value
    const email = form.email.value.trim(); // Get the email value
    const password = form.password.value.trim(); // Get the password value
    const address = form.address.value.trim(); // Get the address value

    // Validate form data before sending it to the backend
    if (!/^[a-zA-Z\s]+$/.test(name)) {
        alert("Please enter a valid name (letters and spaces only).");
        return;
    }
    if (!/^\d{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        alert("Please enter a valid email address.");
        return;
    }
    if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
    }
    if (address === "") {
        alert("Please enter your address.");
        return;
    }

    // Make a POST request to the backend to create the user
    fetch('http://localhost:5000/api/signup', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ name, mobile, email, password, address }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            alert('Sign-up successful!');
            window.location.href = 'login.html'; // Redirect to login page after successful sign-up
        } else {
            alert(data.error || 'An error occurred');
        }
    })
    .catch(err => {
        alert('Server error: ' + err);
    });
}

</script>
