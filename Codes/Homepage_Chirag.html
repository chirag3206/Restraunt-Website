<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-One Restaurant</title>
    <link rel="stylesheet" href="Homepage.css"> <!-- Link to external CSS file -->
</head>
<body>

<header>
    <div class="logo">
        <img src="IMAGES/Logo.jpg" alt="A-One Restaurant Logo"> <!-- Replace with actual logo path -->
    </div>
    <nav>
        <a href="Homepage_Chirag.html">Home</a>
        <a href="gallerypage.html">Gallery</a>
        <a href="order.html">Order online</a>
        <a href="#events">Private Dining/Events</a>
        <a href="aboutpage.html">About</a>
        <a href="contactus.html" class="button">Contact Us</a>
        <a href="login.html" class="button">Login</a>
    </nav>
</header>

<!-- Hero Section -->
<div class="hero" id="hero-section">
    <h1 class="hero-title"></h1> <!-- Title set by JavaScript, positioned above the image -->
    <img src="" alt="Hero Image"> <!-- Image source set by JavaScript -->
</div>

<div class="content">
    <!-- Placeholder Sections to be populated by JavaScript -->
    <div class="section" id="about"></div>
    <div class="section" id="events"></div>
    <div class="section" id="menu"></div>
    <div class="section" id="dinner"></div>
</div>

<!-- Footer -->
<footer>
    <!-- Contact Form -->
    <div class="contact-form">
        <h3>Have a Message?</h3>
        <form>
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="number" placeholder="Number" required>
            <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit">Send Inquiries</button>
        </form>
    </div>

    <!-- Contact Info and Hours (Filled by JavaScript) -->
    <div class="contact-info" id="contact-info"></div>
    <div class="hours" id="hours"></div>
</footer>

<script src="Homepage.js"></script> <!-- Link to external JavaScript file -->

</body>
</html>
